services:

  server:
    build:
      context: ./server
    container_name: eligentia-server
    env_file:
      - ./server/.env
    ports:
      - "5000:5000"
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: eligentia-client
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped